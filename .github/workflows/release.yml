name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: test
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build && cd ..
          go test -tags with_quic,with_utls,with_acme -count=1 ./...
      - name: build
        run: make dist VERSION=${GITHUB_REF_NAME}
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt install.sh \
            --title "sbpanel $GITHUB_REF_NAME" --notes-file dist/NOTES.md
